<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengajuan Cuti Karyawan</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">
  
  <div class="max-w-4xl mx-auto py-10 px-4">
    <!-- Header -->
    <header class="bg-blue-600 text-white rounded-lg p-6 mb-6 shadow-md flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold">Portal Cuti & Izin Karyawan</h1>
        <p class="text-blue-100 text-sm">Kelola pengajuan cuti tahunan, istirahat panjang, dan izin</p>
      </div>
      <div id="user-info" class="text-right hidden">
        <p id="user-name" class="font-semibold text-lg"></p>
        <p id="user-years" class="text-xs bg-blue-700 px-2 py-1 rounded inline-block mt-1"></p>
      </div>
    </header>

    <!-- Login Form (Simulasi Session Email) -->
    <div id="login-card" class="bg-white p-6 rounded-lg shadow-md mb-6">
      <h2 class="text-lg font-bold mb-3">Login Karyawan</h2>
      <div class="flex gap-2">
        <input type="email" id="login-email" placeholder="Masukkan Email Karyawan (cth: budi@company.com)" 
               class="flex-1 border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button onclick="fetchUserData()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded text-sm font-semibold transition">
          Masuk
        </button>
      </div>
    </div>

    <!-- Dashboard Saldo (Hidden before login) -->
    <div id="dashboard" class="hidden">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        
        <div class="bg-white p-5 rounded-lg shadow border-l-4 border-blue-500">
          <p class="text-xs text-gray-500 font-bold uppercase">Cuti Tahunan</p>
          <p id="saldo-tahunan" class="text-3xl font-bold text-gray-800 mt-1">0 <span class="text-sm font-normal text-gray-500">Hari</span></p>
          <p class="text-xs text-gray-400 mt-2">Kuota resmi tahun berjalan</p>
        </div>

        <div class="bg-white p-5 rounded-lg shadow border-l-4 border-amber-500">
          <p class="text-xs text-gray-500 font-bold uppercase">Cuti Carry-Over</p>
          <p id="saldo-carryover" class="text-3xl font-bold text-gray-800 mt-1">0 <span class="text-sm font-normal text-gray-500">Hari</span></p>
          <p class="text-xs text-amber-600 mt-2 font-medium">Kadaluwarsa akhir Februari</p>
        </div>

        <div class="bg-white p-5 rounded-lg shadow border-l-4 border-purple-500">
          <p class="text-xs text-gray-500 font-bold uppercase">Istirahat Panjang</p>
          <p id="status-istirahat" class="text-lg font-bold text-gray-800 mt-2">-</p>
          <p class="text-xs text-gray-400 mt-2">Hak khusus > 5 tahun masa kerja</p>
        </div>

      </div>

      <!-- Form Pengajuan -->
      <div class="bg-white p-6 rounded-lg shadow-md">
        <h2 class="text-lg font-bold mb-4 border-b pb-2">Form Pengajuan Cuti / Izin</h2>
        
        <form id="leave-form" onsubmit="submitForm(event)">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            
            <div>
              <label class="block text-sm font-medium mb-1">Jenis Pengajuan</label>
              <select id="leaveType" required class="w-full border rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
                <option value="annual">Cuti Tahunan</option>
                <option value="permission">Izin (Memotong Cuti Tahunan)</option>
                <option value="long_service">Istirahat Panjang (30 Hari)</option>
              </select>
            </div>

            <div></div>

            <div>
              <label class="block text-sm font-medium mb-1">Tanggal Mulai</label>
              <input type="date" id="startDate" required class="w-full border rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
              <label class="block text-sm font-medium mb-1">Tanggal Selesai</label>
              <input type="date" id="endDate" required class="w-full border rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
            </div>

          </div>

          <button type="submit" id="btn-submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2.5 rounded transition shadow">
            Kirim Pengajuan
          </button>
        </form>
      </div>

      <div id="alert-msg" class="mt-4 p-4 rounded-lg hidden text-sm font-medium"></div>
    </div>

  </div>

  <script>
    // GANTI SESUAI URL WEB APP DEPLOYMENT GOOGLE APPS SCRIPT ANDA
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbz0q8iwOPscUBvpLwMQx4cRiCLi1IOc_eS7vmDDQiHfSNPvLoyWM_Fl2o9xvmtHI5Jk2g/exec";

    let currentEmail = "";

    async function fetchUserData() {
      const emailInput = document.getElementById("login-email").value.trim();
      if (!emailInput) return alert("Masukkan email!");

      const btn = event.target;
      btn.innerText = "Memuat...";
      btn.disabled = true;

      try {
        const response = await fetch(`${GAS_API_URL}?action=getUserData&email=${encodeURIComponent(emailInput)}`);
        const result = await response.json();

        if (result.status === "success") {
          currentEmail = emailInput;
          const user = result.data;

          document.getElementById("user-name").innerText = user.name;
          document.getElementById("user-years").innerText = `Masa Kerja: ${user.yearsOfService} Tahun`;
          document.getElementById("user-info").classList.remove("hidden");
          
          document.getElementById("saldo-tahunan").innerHTML = `${user.currentYearQuota} <span class="text-sm font-normal text-gray-500">Hari</span>`;
          document.getElementById("saldo-carryover").innerHTML = `${user.carryOverQuota} <span class="text-sm font-normal text-gray-500">Hari</span>`;
          
          const statusIstirahat = document.getElementById("status-istirahat");
          if (user.longLeaveActive) {
            statusIstirahat.innerText = "Sedang Aktif (Cuti Tahunan Terkunci)";
            statusIstirahat.className = "text-sm font-bold text-purple-600 mt-2";
          } else if (user.eligibleForLongLeave) {
            statusIstirahat.innerText = "Tersedia (30 Hari)";
            statusIstirahat.className = "text-sm font-bold text-green-600 mt-2";
          } else {
            statusIstirahat.innerText = "Belum memenuhi syarat masa kerja";
            statusIstirahat.className = "text-xs font-normal text-gray-500 mt-2";
          }

          document.getElementById("login-card").classList.add("hidden");
          document.getElementById("dashboard").classList.remove("hidden");
        } else {
          alert(result.message);
        }
      } catch (err) {
        alert("Gagal terhubung ke API Server.");
      } finally {
        btn.innerText = "Masuk";
        btn.disabled = false;
      }
    }

    async function submitForm(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById("btn-submit");
      const alertBox = document.getElementById("alert-msg");
      
      submitBtn.innerText = "Memproses...";
      submitBtn.disabled = true;
      alertBox.classList.add("hidden");

      const payload = {
        action: "submitLeave",
        email: currentEmail,
        leaveType: document.getElementById("leaveType").value,
        startDate: document.getElementById("startDate").value,
        endDate: document.getElementById("endDate").value
      };

      try {
        const response = await fetch(GAS_API_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        
        const result = await response.json();

        alertBox.classList.remove("hidden");
        if (result.status === "success") {
          alertBox.className = "mt-4 p-4 rounded-lg text-sm font-medium bg-green-100 text-green-800 border border-green-300";
          alertBox.innerText = result.message;
          document.getElementById("leave-form").reset();
          setTimeout(fetchUserData, 1500); // Refresh saldo
        } else {
          alertBox.className = "mt-4 p-4 rounded-lg text-sm font-medium bg-red-100 text-red-800 border border-red-300";
          alertBox.innerText = result.message;
        }
      } catch (err) {
        alertBox.classList.remove("hidden");
        alertBox.className = "mt-4 p-4 rounded-lg text-sm font-medium bg-red-100 text-red-800 border border-red-300";
        alertBox.innerText = "Terjadi kesalahan sistem saat mengirim pengajuan.";
      } finally {
        submitBtn.innerText = "Kirim Pengajuan";
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
